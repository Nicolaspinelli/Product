<div class="container">
  <div class="display-4 text-center">Cadastro de Cliente</div>

  <form [formGroup]="formGroupClient">
    <div class="mb-3">
      <label for="inputFullName" class="form-label">Nome completo</label>
      <input id="inputFullName" type="text" class="form-control" formControlName="fullName"
        autocomplete="name" placeholder="Ex.: Maria da Silva">
    </div>

    <div class="mb-3">
      <label for="inputEmail" class="form-label">E-mail</label>
      <input id="inputEmail" type="email" class="form-control" formControlName="email"
        autocomplete="email" placeholder="voce@exemplo.com">
    </div>

    <div class="mb-3">
      <label for="inputPhone" class="form-label">Telefone</label>
      <input id="inputPhone" type="tel" class="form-control" formControlName="phone"
        autocomplete="tel" placeholder="(11) 99999-9999">
    </div>

    <div class="mb-3">
      <label for="inputBirthDate" class="form-label">Data de nascimento</label>
      <input id="inputBirthDate" type="date" class="form-control" formControlName="birthDate"
        autocomplete="bday">
    </div>

    <div class="mb-3">
      <label for="inputContactPreference" class="form-label">Preferência de contato</label>
      <input id="inputContactPreference" type="text" class="form-control" formControlName="contactPreference"
        placeholder="Ex.: telefone, e-mail ou WhatsApp">
    </div>

    <div class="mb-3">
      <label for="inputCustomerType" class="form-label">Tipo de cliente</label>
      <input id="inputCustomerType" type="text" class="form-control" formControlName="customerType"
        placeholder="Informe o tipo de cliente">
    </div>

    <div class="mb-3 form-check">
      <input id="inputPrivacyConsent" type="checkbox" class="form-check-input" formControlName="privacyConsent">
      <label for="inputPrivacyConsent" class="form-check-label">
        Autorizo o uso dos meus dados para a gestão deste cadastro.
      </label>
    </div>

    <button *ngIf="!isEditing" type="button" class="btn btn-primary" (click)="save()">Salvar</button>
    <button *ngIf="isEditing" type="button" class="btn btn-primary" (click)="update()">Atualizar</button>
  </form>

  <div class="display-4 text-center mt-4">Clientes Cadastrados</div>
  Total de clientes: {{ clients().length }}

  <div class="table-responsive">
    <table class="table">
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">Nome</th>
          <th scope="col">E-mail</th>
          <th scope="col">Telefone</th>
          <th scope="col">Nascimento</th>
          <th scope="col">Preferência</th>
          <th scope="col">Tipo</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let client of clients()">
          <th scope="row">{{ client.id }}</th>
          <td>{{ client.fullName }}</td>
          <td>{{ client.email }}</td>
          <td>{{ client.phone }}</td>
          <td>{{ client.birthDate }}</td>
          <td>{{ client.contactPreference }}</td>
          <td>{{ client.customerType }}</td>
          <td>
            <button type="button" class="btn btn-danger" (click)="delete(client)">Remover</button>
          </td>
          <td>
            <button type="button" class="btn btn-secondary" (click)="onClickUpdate(client)">Alterar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
